{{- /* chezmoi:modify-template */ -}}
{{- $c := dict -}}
{{- if .chezmoi.stdin -}}{{- $c = fromToml .chezmoi.stdin -}}{{- end -}}
{{- $c = setValueAtPath "model_reasoning_effort" "medium" $c -}}
{{- $c = setValueAtPath "plan_mode_reasoning_effort" "xhigh" $c -}}
{{- $c = setValueAtPath "personality" "pragmatic" $c -}}
{{- $c = setValueAtPath "approvals_reviewer" "auto_review" $c -}}
{{- $c = setValueAtPath "tui.theme" "base16-256" $c -}}
{{- $c = setValueAtPath "tui.show_tooltips" false $c -}}
{{- $c = setValueAtPath "tui.status_line" (list "model-with-reasoning" "current-dir" "project-name" "git-branch" "branch-changes" "context-used" "five-hour-limit" "approval-mode" "thread-name") $c -}}
{{- $c = setValueAtPath "mcp_servers.openaiDeveloperDocs.url" "https://developers.openai.com/mcp" $c -}}
{{- toToml $c -}}
